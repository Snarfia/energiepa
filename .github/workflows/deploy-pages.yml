name: Website publiceren

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Nieuws en agenda verversen"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "meetings.js"
      - "vergaderingen.html"
      - "assets/**"
      - "data/nieuws.json"
      - "data/vergaderingen.json"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Websitepakket maken
        run: |
          mkdir -p _site/data _site/assets
          cp index.html vergaderingen.html styles.css app.js meetings.js _site/
          cp data/nieuws.json data/vergaderingen.json _site/data/
          cp -R assets/. _site/assets/
          touch _site/.nojekyll

      - name: Websitepakket uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
