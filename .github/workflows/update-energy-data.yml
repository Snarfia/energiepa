name: Nieuws en agenda verversen

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nieuws-verversen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node instellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Officiële nieuwsfeeds ophalen
        run: node scripts/update-data.mjs

      - name: Officiële vergaderagenda ophalen
        run: node scripts/update-meetings.mjs

      - name: Nieuwe berichten en afspraken opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nieuws.json data/vergaderingen.json
          git diff --cached --quiet || git commit -m "chore: ververs overheidsnieuws en agenda"
          git push
